name = "rahma-mall-crm"
main = "worker/src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# D1 Database binding
# Create with:  wrangler d1 create rahma_mall_db
# Then paste the returned database_id below (or into wrangler.production.toml).
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "rahma_mall_db"
database_id = "254cf99d-8a08-4fcd-875a-a4abd67fc766"
migrations_dir = "worker/migrations"

# ---------------------------------------------------------------------------
# Durable Object binding — real-time room (one global instance for the team)
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "TEAM_ROOM"
class_name = "TeamRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TeamRoom"]

# ---------------------------------------------------------------------------
# Static assets (frontend) — served directly by this Worker via assets binding.
# This lets one `wrangler deploy` serve both the API and the SPA.
# (Alternatively deploy frontend/public separately to Cloudflare Pages and
#  point it at this Worker's URL — see README.)
# ---------------------------------------------------------------------------
[assets]
directory = "frontend/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Secrets (set with `wrangler secret put <NAME>`, never commit real values):
#   SESSION_HASH_SECRET   - server-side pepper mixed into password hashing
# ---------------------------------------------------------------------------
[vars]
APP_ENV = "development"

# Every minute: sweeps UPCOMING follow-ups into OVERDUE, detects employee
# idle/offline presence, and evaluates SLA warning/breach thresholds. All three
# need minute-level granularity to feel "live" — a 5-minute cadence made idle
# detection (5 min default threshold) imprecise by up to 5 extra minutes.
[triggers]
crons = ["* * * * *"]
