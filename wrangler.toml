name = "rahma-mall-crm"
main = "worker/src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# D1 Database binding
# Create with:  wrangler d1 create rahma_mall_db
# Then paste the returned database_id below (or into wrangler.production.toml).
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "rahma_mall_db"
database_id = "254cf99d-8a08-4fcd-875a-a4abd67fc766"
migrations_dir = "worker/migrations"

# ---------------------------------------------------------------------------
# Durable Object binding — real-time room (one global instance for the team)
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "TEAM_ROOM"
class_name = "TeamRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TeamRoom"]

# ---------------------------------------------------------------------------
# Static assets (frontend) — served directly by this Worker via assets binding.
# This lets one `wrangler deploy` serve both the API and the SPA.
# (Alternatively deploy frontend/public separately to Cloudflare Pages and
#  point it at this Worker's URL — see README.)
# ---------------------------------------------------------------------------
[assets]
directory = "frontend/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Secrets (set with `wrangler secret put <NAME>`, never commit real values):
#   SESSION_HASH_SECRET   - server-side pepper mixed into password hashing
# ---------------------------------------------------------------------------
[vars]
APP_ENV = "development"

# Two cron cadences, split by actual cost/urgency (see index.js's scheduled()
# for which sweep runs on which one) — this replaced a single "everything,
# every minute" trigger that was reading far more D1 rows per day than the
# free tier allows, almost entirely from cron overhead rather than real
# traffic (recordDailySnapshots alone recomputes a full report-style query
# set for every employee on every one of 1,440 ticks/day, whether or not
# anyone is using the app — e.g. at 3am or on a holiday).
#   * * * * *   — presence idle/offline detection only. This is the one
#                 thing people actually notice within a minute (a stale
#                 "online" dot), and it's cheap (only touches employees whose
#                 state is actually changing, not a full per-employee scan).
#   */5 * * * * — everything else: overdue follow-ups, SLA/customer-waiting
#                 alerts, the daily performance snapshot, temporary-DND
#                 revert, late-attendance/off-hours-DND/ops-reports/
#                 auto-reclaim. All of these already have their own
#                 same-day dedup guards, so a 5-minute cadence only ever
#                 costs a few minutes of lag, never a missed or duplicate
#                 run — but cuts their D1 reads by roughly 80%.
[triggers]
crons = ["* * * * *", "*/5 * * * *"]
